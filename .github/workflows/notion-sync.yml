# Notion → Obsidian 동기화 실행 (tools/notion-sync/ci/onedrive_sync.py).
# 공개 저장소 보호:
#   - 비밀값은 Environment "notion-sync"(배포 브랜치 main 만)에만 둔다 → 다른 브랜치·fork PR 실행에는 비밀값이 없다.
#   - 로그에는 개수만 나온다. 엔진 출력·페이지 ID·경로는 OneDrive <관리 폴더>/_sync/logs 로만 간다.
#   - actions/cache 를 쓰지 않는다(fork PR 이 기본 브랜치 캐시를 복원할 수 있다) → 매 실행 OneDrive 에서 미러를 받는다.
#   - id-token 권한이 없다 → AWS OIDC·lavcca-dev 배포 역할과 무관.
#   - 대상 경로는 입력이 아니라 Environment 변수(NOTION_SYNC_REMOTE_ROOT, NOTION_SYNC_ROOT_DIR)로만 정한다.
# 트리거: 수동 실행(쓰기 권한자) 또는 Webhook Worker(Actions:write 전용 토큰)의 workflow_dispatch.
#   schedule(정기 대조)은 실제 Vault 전환 때 추가한다.
name: notion-sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run 은 잠금 외에 OneDrive 에 아무것도 쓰지 않는다"
        type: choice
        options: [dry-run, apply]
        default: dry-run
      full:
        description: "전체 크롤 강제"
        type: boolean
        default: false
      hint:
        description: "Webhook Worker 가 넘기는 변경 힌트(JSON). 비워 두면 Notion 검색으로만 판단"
        type: string
        default: ""

# 모든 트리거를 통틀어 한 번에 하나만 실행: ci/onedrive_sync.py 의 고아 잠금 인수가 이 보장에 기대고 있다.
concurrency:
  group: lavcca-notion-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: notion-sync
    defaults:
      run:
        working-directory: tools/notion-sync
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SYNC_CONFIG: ${{ secrets.NOTION_SYNC_CONFIG }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
          NEW_REFRESH_TOKEN_FILE: ${{ runner.temp }}/ms_rt
          REMOTE_ROOT: ${{ vars.NOTION_SYNC_REMOTE_ROOT }}
          ROOT_DIR: ${{ vars.NOTION_SYNC_ROOT_DIR }}
          MODE: ${{ inputs.mode }}
          FULL: ${{ inputs.full }}
          MIRROR: ${{ runner.temp }}/mirror
        run: |
          if [ -z "$REMOTE_ROOT" ] || [ -z "$ROOT_DIR" ]; then
            echo "Environment 변수 NOTION_SYNC_REMOTE_ROOT / NOTION_SYNC_ROOT_DIR 가 없다"; exit 2
          fi
          args=(--mirror "$MIRROR" --remote-root "$REMOTE_ROOT" --root-dir "$ROOT_DIR")
          if [ "$MODE" = "dry-run" ]; then args+=(--dry-run); fi
          if [ "$FULL" = "true" ]; then args+=(--full); fi
          python -m ci.onedrive_sync "${args[@]}"

      # Microsoft 는 refresh token 을 쓸 때마다 새 것을 준다: 다음 실행이 쓰도록 Environment 비밀값을 교체
      - name: store rotated refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.NOTION_SYNC_SECRETS_PAT }}
          F: ${{ runner.temp }}/ms_rt
        run: |
          if [ -s "$F" ]; then gh secret set MS_REFRESH_TOKEN --env notion-sync --repo "$GITHUB_REPOSITORY" < "$F"; fi
          rm -f "$F"
