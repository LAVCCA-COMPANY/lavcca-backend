# 워커 컨테이너 이미지: PR 은 빌드·스모크·취약점 보고만, main 은 승인 후 ECR 푸시.
#   build   (pull_request)          AWS 자격 증명 없음. 취약점은 보고만(실패 아님).
#   publish (main push / 수동 실행)   GitHub Environment "lavcca-dev" 승인 → OIDC → ECR 푸시(태그 = Git SHA).
#                                    fixable CRITICAL 취약점·스모크 실패면 푸시하지 않는다.
# ECS 태스크 정의 갱신·실행은 여기서 하지 않는다(PM 이 CloudFormation ImageTag 로 반영, infra/README.md).
# 필요 설정(PM): Environment lavcca-dev — 배포 브랜치 main(+1차 배포 동안 chore/lavcca-worker-deploy), Required reviewers,
#   변수 LAVCCA_ECR_PUSH_ROLE_ARN = 스택 출력 GitHubEcrPushRoleArn,
#   저장소 OIDC sub 사용자 지정 ["repo","context","ref"] + use_immutable_subject (infra/README.md T3-3).
#   immutable sub = repo:<owner>@<owner_id>/<repo>@<repo_id>:environment:lavcca-dev:ref:<ref> (이름 변경에 영향 없음)
name: worker-image

on:
  workflow_dispatch:
    inputs:
      auth_check_only:
        description: "OIDC → AWS 인증만 확인(빌드·ECR 푸시 없음)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "apps/worker/**"
      - "!apps/worker/tests/**"
      - ".github/workflows/worker-image.yml"
      - ".github/actions/build-worker/**"
      - ".github/scripts/worker_smoke.py"
  push:
    branches: ["main"]
    paths:
      - "apps/worker/**"
      - "!apps/worker/tests/**"
      - ".github/workflows/worker-image.yml"
      - ".github/actions/build-worker/**"
      - ".github/scripts/worker_smoke.py"

permissions:
  contents: read

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: lavcca-worker

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-worker
        with:
          tag: ${{ github.sha }}
          fail-on-critical: "0"
          ai-token: ${{ secrets.LAVCCA_AI_READ_TOKEN }}

  # 수동 실행 + auth_check_only: OIDC 토큰으로 역할을 맡을 수 있는지만 본다. checkout·빌드·ECR 단계가 없다.
  auth-check:
    if: github.event_name == 'workflow_dispatch' && inputs.auth_check_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: lavcca-dev
    permissions:
      id-token: write
    steps:
      - name: OIDC claims (토큰은 출력하지 않음)
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          req = urllib.request.Request(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com",
                                       headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          payload = json.load(urllib.request.urlopen(req))["value"].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print(f"sub={claims.get('sub')}\naud={claims.get('aud')}")
          PY

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LAVCCA_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-auth-check-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Caller identity
        run: aws sts get-caller-identity --query Arn --output text

  publish:
    # main(push·수동) + main 병합 전 1차 배포용 브랜치(수동 실행만). AWS 쪽도 sub 의 ref 로 같은 브랜치만 받는다.
    if: >-
      github.event_name != 'pull_request' && !inputs.auth_check_only &&
      (github.ref == 'refs/heads/main' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chore/lavcca-worker-deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: lavcca-dev
    permissions:
      contents: read
      id-token: write   # OIDC → LavccaGithubEcrPushRole (sub = repo:...:environment:lavcca-dev:ref:refs/heads/<branch>)
    steps:
      # 빌드(수십 분) 전에 OIDC sub 가 역할 신뢰 정책 형식인지 확인한다. 토큰은 출력하지 않고 클레임만 본다.
      - name: OIDC subject check
        env:
          EXPECTED_SUB: repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}:environment:lavcca-dev:ref:${{ github.ref }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          req = urllib.request.Request(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com",
                                       headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          payload = json.load(urllib.request.urlopen(req))["value"].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          sub, want = claims.get("sub"), os.environ["EXPECTED_SUB"]
          print(f"sub={sub}\naud={claims.get('aud')}\nexpected={want}")
          if sub != want:
              raise SystemExit("OIDC sub 불일치: 저장소 sub 사용자 지정(infra/README.md T3-3)을 확인하세요")
          PY

      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-worker
        with:
          tag: ${{ github.sha }}
          fail-on-critical: "1"
          ai-token: ${{ secrets.LAVCCA_AI_READ_TOKEN }}

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LAVCCA_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-worker-${{ github.run_id }}
          mask-aws-account-id: true   # 공개 저장소: 로그에 계정 ID 를 남기지 않는다

      - name: ECR login
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push (tag = Git SHA, immutable)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker tag "lavcca-worker:$TAG" "$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"

      - name: ECR scan result
        env:
          TAG: ${{ github.sha }}
        run: |
          aws ecr wait image-scan-complete --repository-name "$ECR_REPOSITORY" --image-id imageTag="$TAG"
          counts=$(aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" --image-id imageTag="$TAG" \
                     --query 'imageScanFindings.findingSeverityCounts' --output json)
          {
            echo "### lavcca-worker:$TAG"
            echo "ECR basic scan: \`$counts\`"
            echo "다음 단계(PM): CloudFormation 스택 lavcca-worker-dev 의 ImageTag=$TAG 로 갱신 후 run-task"
          } >> "$GITHUB_STEP_SUMMARY"
