# 워커 컨테이너 이미지 빌드 + 스모크 테스트 (T2)
# 로컬에 Docker 가 없어도 Dockerfile 이 실제로 빌드되고 한글 PDF·OCR·모델 로드가 되는지 확인한다.
# 비밀값·AWS·Gemini 는 쓰지 않는다(분석 실행 없음). ECR 푸시는 아직 없음(T3 이후 OIDC 로 추가).
name: worker-image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mvp 1_9_3/Dockerfile"
      - "mvp 1_9_3/.dockerignore"
      - "mvp 1_9_3/requirements.txt"
      - "mvp 1_9_3/copyright_detector/requirements.txt"
      - "mvp 1_9_3/worker.py"
      - "mvp 1_9_3/mvp_ver_1_9_3.py"
      - "mvp 1_9_3/pdf_from_md.py"
      - ".github/workflows/worker-image.yml"
  push:
    branches: ["chore/t2-worker"]
    paths:
      - "mvp 1_9_3/Dockerfile"
      - "mvp 1_9_3/.dockerignore"
      - "mvp 1_9_3/requirements.txt"
      - "mvp 1_9_3/copyright_detector/requirements.txt"
      - "mvp 1_9_3/worker.py"
      - "mvp 1_9_3/mvp_ver_1_9_3.py"
      - "mvp 1_9_3/pdf_from_md.py"
      - ".github/workflows/worker-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # torch·transformers·CLIP 가 들어가 이미지가 크다 → 러너 기본 디스크 확보
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build
        run: docker build -t natam-worker "mvp 1_9_3"

      - name: Image size
        run: docker image ls natam-worker

      - name: Worker CLI
        run: docker run --rm natam-worker --help

      - name: Copyright detector CLI
        run: docker run --rm -w /app/copyright_detector --entrypoint python natam-worker main.py --help

      - name: Imports, model, PDF fonts, OCR, ffmpeg
        run: |
          docker run --rm -i --entrypoint python natam-worker - <<'EOF'
          import os, subprocess, tempfile, warnings
          warnings.filterwarnings("ignore")
          import mvp_ver_1_9_3                      # whisper·torch·faiss·cv2·genai import
          import torch, joblib
          assert not torch.cuda.is_available()
          print("torch", torch.__version__)
          b = joblib.load("models/controversy_model.joblib")
          print("classifier classes:", len(b["mlb"].classes_))

          import pdf_from_md, fitz
          d = tempfile.mkdtemp()
          md = os.path.join(d, "t.md")
          with open(md, "w", encoding="utf-8") as f:
              f.write("# 한글 테스트\n\n| 항목 | 값 |\n|---|---|\n| 위험도 | 🔴 높음 |\n\n```\ncode 코드\n```\n")
          pdf = pdf_from_md.render(md, os.path.join(d, "t.pdf"))
          assert pdf, "PDF 생성 실패"
          doc = fitz.open(pdf)
          fonts = {f[3] for p in doc for f in p.get_fonts()}
          print("pdf fonts:", sorted(fonts))
          assert any("Nanum" in f for f in fonts), fonts
          assert "한글" in doc[0].get_text()

          import pytesseract
          langs = set(pytesseract.get_languages())
          print("tesseract", pytesseract.get_tesseract_version(), sorted(langs))
          assert {"kor", "eng"} <= langs
          subprocess.run(["ffmpeg", "-version"], check=True, capture_output=True)
          print("smoke ok")
          EOF
