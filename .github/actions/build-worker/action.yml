# 워커 이미지 빌드 + 스모크 테스트 + Trivy 취약점 검사 (AWS 자격 증명 없이 실행).
# worker-image.yml 의 PR 검사와 배포(publish) 잡이 같은 절차를 쓰도록 묶었다.
# 엔진은 ai(비공개)에서 apps/worker/ai-engine.ref 에 고정한 커밋/태그를 받아 apps/worker/ 에 겹쳐 놓는다
# → 이미지 /app 구성은 분리 전과 같다(엔진 루트 + worker.py).
name: build-worker
description: Build the Lavcca worker image, smoke-test it and scan it for vulnerabilities
inputs:
  tag:
    description: local image tag (lavcca-worker:<tag>)
    required: true
  fail-on-critical:
    description: '"1" fails the job on fixable CRITICAL vulnerabilities, "0" only reports'
    required: true
  ai-token:
    description: read-only token for LAVCCA-COMPANY/ai (secret LAVCCA_AI_READ_TOKEN)
    required: true
runs:
  using: composite
  steps:
    # torch·transformers·CLIP 가 들어가 이미지가 크다 → 러너 기본 디스크 확보
    - name: Free disk
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

    - name: AI engine ref
      id: ai
      shell: bash
      env:
        AI_TOKEN: ${{ inputs.ai-token }}
      run: |
        if [ -z "$AI_TOKEN" ]; then
          echo "::error::LAVCCA_AI_READ_TOKEN 미설정 — ai(비공개)를 받을 수 없어 이미지를 만들 수 없습니다"
          exit 1
        fi
        ref=$(tr -d '[:space:]' < apps/worker/ai-engine.ref)
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        echo "ai ref: $ref"

    - uses: actions/checkout@v4
      with:
        repository: LAVCCA-COMPANY/ai
        ref: ${{ steps.ai.outputs.ref }}
        token: ${{ inputs.ai-token }}
        path: _ai
        persist-credentials: false

    # 엔진 파일을 워커 폴더에 겹친다. worker.py·Dockerfile·.dockerignore 는 덮어쓰지 않는다(-n)
    - name: Overlay engine
      shell: bash
      run: |
        rm -rf _ai/.git _ai/.github
        cp -rn _ai/. apps/worker/
        rm -rf _ai
        test -f apps/worker/mvp_ver_1_9_3.py && test -f apps/worker/requirements.txt && test -f apps/worker/copyright_detector/requirements.txt

    - name: Build
      shell: bash
      run: docker build -t "lavcca-worker:${{ inputs.tag }}" "apps/worker"

    - name: Image size
      shell: bash
      run: docker image ls lavcca-worker

    - name: Worker CLI
      shell: bash
      run: docker run --rm "lavcca-worker:${{ inputs.tag }}" --help

    - name: Copyright detector CLI
      shell: bash
      run: docker run --rm -w /app/copyright_detector --entrypoint python "lavcca-worker:${{ inputs.tag }}" main.py --help

    - name: Imports, model, PDF fonts, ffmpeg
      shell: bash
      run: docker run --rm -i --entrypoint python "lavcca-worker:${{ inputs.tag }}" - < .github/scripts/worker_smoke.py

    - name: Vulnerability scan (Trivy, fixable CRITICAL)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (commit SHA pinned)
      with:
        image-ref: lavcca-worker:${{ inputs.tag }}
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: ${{ inputs.fail-on-critical }}
        format: table
